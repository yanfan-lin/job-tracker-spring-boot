spring.application.name=job-tracker

# Set the local development server port
server.port=8080

# Disable persistent servlet sessions
server.servlet.session.persistent=false

# Configure PostgreSQL using environment variables; defaults match the Docker Compose database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/job_tracker}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Allow Hibernate to create or update tables during development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Open Session in View because this project uses a service layer for database access
spring.jpa.open-in-view=false

# Expose only the health endpoint from Spring Boot Actuator
management.endpoints.web.exposure.include=health

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600

# Keep Swagger protected unless explicitly enabled for local development
app.swagger.public=${SWAGGER_PUBLIC:false}
