spring.application.name=job-tracker

# Read PostgreSQL settings from the environment, using Docker Compose values by default.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/job_tracker}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Let Hibernate create or update tables during development.
spring.jpa.hibernate.ddl-auto=update

# Keep database access inside the service layer.
spring.jpa.open-in-view=false

# Configure login tokens.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600

# Keep Swagger protected unless local development explicitly enables it.
app.swagger.public=${SWAGGER_PUBLIC:false}
