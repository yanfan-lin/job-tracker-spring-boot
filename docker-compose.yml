# Run the Job Tracker API with PostgreSQL

services:
  db:
    image: postgres:16
    container_name: job-tracker-db

    environment:
      POSTGRES_DB: job_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - job_tracker_data:/var/lib/postgresql/data

    # Wait for PostgreSQL to become ready before starting the API
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d job_tracker" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: job-tracker-api

    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/job_tracker
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres

      # Require the JWT secret from the host environment
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set before starting Docker Compose}

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy

volumes:
  job_tracker_data:
